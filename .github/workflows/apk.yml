name: APK bauen

# Baut die YSKAR Wallet (Android) und stellt die APK bereit.
#
#   Push auf main      -> APK als Artefakt am Lauf (Actions -> Lauf -> Artifacts)
#   Tag v1.2.3         -> zusaetzlich ein Release mit der APK
#   von Hand (Actions) -> wie ein Push
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   YSKAR_KEYSTORE_BASE64    der Test-Keystore als Base64
#   YSKAR_KEYSTORE_PASSWORD  Passwort des Keystores
#   YSKAR_KEY_ALIAS          Alias des Schluessels
#   YSKAR_KEY_PASSWORD       Passwort des Schluessels
#
# Ohne diese Secrets entsteht ein Debug-Bau. Der laesst sich installieren,
# ist aber NICHT zum Verteilen gedacht: Sein Schluessel wechselt mit jedem
# Lauf, eine neue Fassung liesse sich nicht ueber die alte installieren.
#
# Der Keystore darf nie ins Repo. Geht er verloren, kann kein Update mehr
# ueber eine bestehende Installation gelegt werden.

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    # Fest auf 24.04: Mit diesem Abbild ist der Bau geprueft. "ubuntu-latest"
    # wechselt ohne Ankuendigung im Repo auf ein neueres.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      YSKAR_KEYSTORE_BASE64: ${{ secrets.YSKAR_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Das Android-SDK ist auf dem Abbild vorinstalliert (ANDROID_HOME).
      # Nur Plattform und Build-Tools nachziehen, die variables.gradle verlangt.
      - name: Android-SDK-Pakete
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Abhängigkeiten
        run: npm ci

      - name: Version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            NAME="${GITHUB_REF#refs/tags/v}"
          else
            NAME="0.1.${GITHUB_RUN_NUMBER}-test"
          fi
          # versionCode muss streng steigen: die Laufnummer genuegt dafuer.
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "code=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"
          echo "Version ${NAME}, Code $((1000 + GITHUB_RUN_NUMBER))"

      # Schluessel, Adressen und Ueberweisungen muessen dieselben sein wie im
      # Hauptrepo. Schlaegt das fehl, entsteht keine APK.
      - name: Tests
        run: npm test

      - name: Oberfläche bauen
        env:
          YSKAR_VERSION: ${{ steps.version.outputs.name }}
        run: npm run build

      - name: Bündel prüfen
        run: node werkzeug/buendel-pruefen.mjs

      - name: Capacitor synchronisieren
        run: npx cap sync android

      - name: Keystore ablegen
        if: env.YSKAR_KEYSTORE_BASE64 != ''
        run: |
          echo "$YSKAR_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/yskar-wallet.jks"
          echo "YSKAR_KEYSTORE_FILE=$RUNNER_TEMP/yskar-wallet.jks" >> "$GITHUB_ENV"

      - name: APK bauen
        working-directory: android
        env:
          YSKAR_KEYSTORE_PASSWORD: ${{ secrets.YSKAR_KEYSTORE_PASSWORD }}
          YSKAR_KEY_ALIAS: ${{ secrets.YSKAR_KEY_ALIAS }}
          YSKAR_KEY_PASSWORD: ${{ secrets.YSKAR_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "${YSKAR_KEYSTORE_FILE:-}" ]; then ZIEL=assembleRelease; else ZIEL=assembleDebug; fi
          echo "Baue $ZIEL"
          ./gradlew --no-daemon "$ZIEL" \
            -PversionName="${{ steps.version.outputs.name }}" \
            -PversionCode="${{ steps.version.outputs.code }}"

      - name: APK benennen und prüfen
        id: apk
        run: |
          set -e
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          if [ -z "${YSKAR_KEYSTORE_FILE:-}" ]; then
            SRC=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
            OUT="yskar-wallet-test-${{ steps.version.outputs.name }}-debug.apk"
            cp "$SRC" "$OUT"
            echo "::warning::Kein Keystore hinterlegt: Debug-Bau. Nicht an Tester geben, sein Schluessel wechselt mit jedem Lauf."
            echo "signiert=false" >> "$GITHUB_OUTPUT"
          else
            SRC=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
            OUT="yskar-wallet-test-${{ steps.version.outputs.name }}.apk"
            cp "$SRC" "$OUT"
            echo "signiert=true" >> "$GITHUB_OUTPUT"
          fi
          "$APKSIGNER" verify --print-certs "$OUT" | grep -E "certificate (DN|SHA-256)" | head -2 | tee zertifikat.txt
          sha256sum "$OUT" | tee "$OUT.sha256"
          echo "datei=$OUT" >> "$GITHUB_OUTPUT"
          {
            echo "## YSKAR Wallet Test ${{ steps.version.outputs.name }}"
            echo ""
            if [ -z "${YSKAR_KEYSTORE_FILE:-}" ]; then
              echo "**Debug-Bau, nicht verteilen.** Es ist kein Test-Keystore hinterlegt."
            else
              echo "Signiert mit dem hinterlegten Test-Schlüssel. Diese Datei kann an Tester gehen."
            fi
            echo ""
            echo "- Datei: \`$OUT\` (unten unter *Artifacts*)"
            echo "- versionCode: ${{ steps.version.outputs.code }}"
            echo "- SHA-256: \`$(cut -d' ' -f1 "$OUT.sha256")\`"
            echo "- $(sed -n 2p zertifikat.txt)"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.datei }}
          path: |
            ${{ steps.apk.outputs.datei }}
            ${{ steps.apk.outputs.datei }}.sha256
          retention-days: 30

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') && steps.apk.outputs.signiert == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: YSKAR Wallet Test ${{ steps.version.outputs.name }}
          prerelease: true
          generate_release_notes: true
          files: |
            ${{ steps.apk.outputs.datei }}
            ${{ steps.apk.outputs.datei }}.sha256
