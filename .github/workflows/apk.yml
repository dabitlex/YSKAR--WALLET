name: App bauen

# Baut die YSKAR Wallet (Android) und veroeffentlicht sie auf GitHub.
#
#   Push auf main      -> signierte APK als Artefakt am Lauf (Actions -> Lauf -> Artifacts)
#   von Hand (Actions) -> wie ein Push
#   Tag v1.2.3         -> zusaetzlich ein GitHub-Release mit der APK, ihrer
#                         Pruefsumme und dem Fingerabdruck der Signatur
#
# Versionsname: aus package.json ("version"). Ein Tag muss dazu passen
# (Tag v1.0.1 nur, wenn package.json 1.0.1 sagt), sonst bricht der Lauf ab.
# versionCode: 1000 + Laufnummer, steigt mit jedem Lauf. Android installiert
# eine neue Fassung nur ueber eine alte, wenn ihr versionCode groesser ist.
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   YSKAR_KEYSTORE_BASE64    der Release-Keystore als Base64
#   YSKAR_KEYSTORE_PASSWORD  Passwort des Keystores
#   YSKAR_KEY_ALIAS          Alias des Schluessels
#   YSKAR_KEY_PASSWORD       Passwort des Schluessels
#
# Ohne diese Secrets entsteht ein Debug-Bau zum eigenen Testen. Sein
# Schluessel wird einmal auf dem Runner erzeugt und liegt danach im Cache von
# GitHub Actions: Jede neue Debug-Fassung ist mit demselben Schluessel
# signiert und laesst sich ueber die vorige installieren.
#
#   - Der Debug-Schluessel steht nicht im Repo und verlaesst GitHub nicht.
#   - GitHub loescht Cache-Eintraege, die 7 Tage lang niemand gelesen hat.
#     Liegt zwischen zwei Debug-Bauten mehr Zeit, entsteht ein neuer
#     Schluessel, und die naechste Fassung braucht einmal "deinstallieren".
#     Der Lauf meldet das mit einer Warnung.
#   - Ein Debug-Bau wird nie als Release veroeffentlicht.
#
# Der Keystore darf nie ins Repo. Geht er verloren, laesst sich keine neue
# Fassung mehr ueber eine installierte legen: Nutzer muessten deinstallieren
# und ihre Wallet mit den 12 Woertern neu einrichten.

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    # Fest auf 24.04: Mit diesem Abbild ist der Bau geprueft. "ubuntu-latest"
    # wechselt ohne Ankuendigung im Repo auf ein neueres.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      YSKAR_KEYSTORE_BASE64: ${{ secrets.YSKAR_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Das Android-SDK ist auf dem Abbild vorinstalliert (ANDROID_HOME).
      # Nur Plattform und Build-Tools nachziehen, die variables.gradle verlangt.
      - name: Android-SDK-Pakete
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Abhängigkeiten
        run: npm ci

      - name: Version
        id: version
        run: |
          NAME=$(node -p "require('./package.json').version")
          if [[ "${GITHUB_REF}" == refs/tags/v* ]] && [ "${GITHUB_REF#refs/tags/v}" != "$NAME" ]; then
            echo "::error title=Version::Tag ${GITHUB_REF#refs/tags/} passt nicht zu package.json ($NAME)."
            exit 1
          fi
          # versionCode muss streng steigen: die Laufnummer genuegt dafuer.
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "code=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"
          echo "Version ${NAME}, Code $((1000 + GITHUB_RUN_NUMBER))"

      # Schluessel, Adressen und Ueberweisungen muessen dieselben sein wie im
      # Hauptrepo. Schlaegt das fehl, entsteht keine APK.
      - name: Tests
        run: npm test

      - name: Oberfläche bauen
        env:
          YSKAR_VERSION: ${{ steps.version.outputs.name }}
        run: npm run build

      - name: Bündel prüfen
        run: node werkzeug/buendel-pruefen.mjs

      - name: Capacitor synchronisieren
        run: npx cap sync android

      - name: Keystore ablegen
        if: env.YSKAR_KEYSTORE_BASE64 != ''
        run: |
          echo "$YSKAR_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/yskar-wallet.jks"
          echo "YSKAR_KEYSTORE_FILE=$RUNNER_TEMP/yskar-wallet.jks" >> "$GITHUB_ENV"

      # Nur fuer den Debug-Bau (kein Test-Schluessel hinterlegt): derselbe
      # Debug-Schluessel wie beim letzten Lauf, solange er noch im Cache liegt.
      - name: Debug-Schlüssel aus dem Cache
        if: env.YSKAR_KEYSTORE_BASE64 == ''
        id: debugkey
        uses: actions/cache@v4
        with:
          path: ~/.yskar-wallet/debug.keystore
          key: yskar-wallet-debug-schluessel-v1

      - name: Debug-Schlüssel anlegen
        if: env.YSKAR_KEYSTORE_BASE64 == '' && steps.debugkey.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.yskar-wallet"
          rm -f "$HOME/.yskar-wallet/debug.keystore"
          keytool -genkeypair -keystore "$HOME/.yskar-wallet/debug.keystore" -storetype PKCS12 \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10950 -dname "CN=YSKAR Wallet Debug" > /dev/null 2>&1
          echo "::warning title=Neuer Debug-Schlüssel::Im Cache lag kein Debug-Schlüssel, es wurde ein neuer angelegt. Diese Fassung lässt sich nicht über eine ältere installieren: einmal deinstallieren."

      - name: Debug-Schlüssel verwenden
        if: env.YSKAR_KEYSTORE_BASE64 == ''
        run: |
          test -s "$HOME/.yskar-wallet/debug.keystore"
          echo "YSKAR_DEBUG_KEYSTORE=$HOME/.yskar-wallet/debug.keystore" >> "$GITHUB_ENV"

      - name: App bauen
        working-directory: android
        env:
          YSKAR_KEYSTORE_PASSWORD: ${{ secrets.YSKAR_KEYSTORE_PASSWORD }}
          YSKAR_KEY_ALIAS: ${{ secrets.YSKAR_KEY_ALIAS }}
          YSKAR_KEY_PASSWORD: ${{ secrets.YSKAR_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "${YSKAR_KEYSTORE_FILE:-}" ]; then ZIEL=assembleRelease; else ZIEL=assembleDebug; fi
          echo "Baue $ZIEL"
          ./gradlew --no-daemon $ZIEL \
            -PversionName="${{ steps.version.outputs.name }}" \
            -PversionCode="${{ steps.version.outputs.code }}"

      - name: Dateien benennen und prüfen
        id: apk
        run: |
          set -e
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          if [ -z "${YSKAR_KEYSTORE_FILE:-}" ]; then
            SRC=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
            OUT="yskar-wallet-${{ steps.version.outputs.name }}-debug.apk"
            cp "$SRC" "$OUT"
            echo "signiert=false" >> "$GITHUB_OUTPUT"
          else
            SRC=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
            if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
              OUT="yskar-wallet-${{ steps.version.outputs.name }}.apk"
            else
              OUT="yskar-wallet-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}.apk"
            fi
            cp "$SRC" "$OUT"
            echo "signiert=true" >> "$GITHUB_OUTPUT"
          fi
          "$APKSIGNER" verify --print-certs "$OUT" | grep -E "certificate (DN|SHA-256)" | head -2 | tee zertifikat.txt
          # Der Fingerabdruck des Zertifikats ist oeffentlich (er steckt in jeder APK). Bleibt er
          # von Lauf zu Lauf gleich, laesst sich die neue Fassung ueber die alte installieren.
          echo "::notice title=Signatur::$(sed -n 2p zertifikat.txt | sed 's/^.*SHA-256 digest: //')"
          sha256sum "$OUT" | tee "$OUT.sha256"
          echo "datei=$OUT" >> "$GITHUB_OUTPUT"
          {
            echo "## YSKAR Wallet ${{ steps.version.outputs.name }} (Code ${{ steps.version.outputs.code }})"
            echo ""
            if [ -z "${YSKAR_KEYSTORE_FILE:-}" ]; then
              echo "**Debug-Bau zum eigenen Testen.** Wird nie als Release veröffentlicht."
            else
              echo "Signiert mit dem Release-Schlüssel."
            fi
            echo ""
            echo "- APK: \`$OUT\` (unten unter *Artifacts*)"
            echo "- versionCode: ${{ steps.version.outputs.code }}"
            echo "- SHA-256: \`$(cut -d' ' -f1 "$OUT.sha256")\`"
            echo "- $(sed -n 2p zertifikat.txt)"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.datei }}
          path: |
            ${{ steps.apk.outputs.datei }}
            ${{ steps.apk.outputs.datei }}.sha256
          retention-days: 30

      - name: Release-Text
        if: startsWith(github.ref, 'refs/tags/v') && steps.apk.outputs.signiert == 'true'
        run: |
          OUT="${{ steps.apk.outputs.datei }}"
          SHA=$(cut -d' ' -f1 "$OUT.sha256")
          ZERT=$(sed -n 2p zertifikat.txt | sed 's/^.*SHA-256 digest: //')
          {
            echo "**YSKAR Wallet ${{ steps.version.outputs.name }}** – send, receive and sign YSR. Your key stays on your device."
            echo ""
            echo "### Install"
            echo "1. Download \`$OUT\` below on your Android phone (Android 7 or newer)."
            echo "2. Open it and allow installing from this source when Android asks."
            echo "3. Updates install over the previous version – your wallet stays on the device."
            echo ""
            echo "### Verify"
            echo "- SHA-256 of the APK: \`$SHA\`"
            echo "- Signing certificate (SHA-256): \`$ZERT\`"
            echo ""
            echo "Every release is signed with the same key. If the certificate fingerprint differs, do not install the file."
            echo ""
            echo "---"
            echo ""
            echo "**Deutsch:** APK unten auf dem Android-Handy herunterladen, öffnen und die Installation aus dieser Quelle erlauben. Updates lassen sich über die vorige Fassung installieren, die Wallet bleibt erhalten. Prüfsumme und Fingerabdruck stehen oben – weicht der Fingerabdruck ab, die Datei nicht installieren."
          } > release.md

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') && steps.apk.outputs.signiert == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: YSKAR Wallet ${{ steps.version.outputs.name }}
          body_path: release.md
          files: |
            ${{ steps.apk.outputs.datei }}
            ${{ steps.apk.outputs.datei }}.sha256
